<?xml version="1.0" encoding="UTF-8"?>
<svg width="@@WIDTH@@" height="@@HEIGHT@@" viewBox="0 0 @@WIDTH@@ @@HEIGHT@@" xmlns="http://www.w3.org/2000/svg">
@@METADATA@@
  <desc>Compact scripted matrix-driven Gaussian splat SVG. The source stores one data row per splat and expands browser-compatible SVG gradients at load time.</desc>
  <defs id="defs"><style>.splat { mix-blend-mode: normal; }</style></defs>
  <rect width="@@WIDTH@@" height="@@HEIGHT@@" fill="@@BACKGROUND@@" class="background"/>
  <g id="splats"></g>
  <script id="splat-data" type="application/octet-stream">@@ROWS@@</script>
  <script><![CDATA[@@SCRIPT@@]]></script>
</svg>

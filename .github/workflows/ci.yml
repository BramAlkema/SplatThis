name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every platform finish so one environment-specific failure does not
      # hide the Linux/Windows results needed to diagnose cross-OS behavior.
      fail-fast: false
      # Single Python version (3.13), three OSes. We don't gain coverage
      # from older Pythons — MLX and the venv are 3.13. Cross-OS still
      # catches pathlib / line-ending / shell quirks.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[dev,capture]'

    - name: Verify governing Chrome renderer
      run: |
        python -c "from png2svg_gs.browser_capture import PlaywrightSvgRenderer, resolve_browser_executable; r=PlaywrightSvgRenderer(browser_executable=resolve_browser_executable()).start(); print('Chrome', r.browser_version); r.close()"

    - name: Install MLX (Apple Silicon backend)
      # macos-latest runners are arm64; installing mlx lets the MLX
      # parity/loss/renderer tests actually run instead of skipping.
      if: runner.os == 'macOS' && runner.arch == 'ARM64'
      run: |
        pip install mlx

    - name: Lint with flake8
      run: |
        flake8 src/ tests/ tools/

    - name: Check formatting with black
      run: |
        black --check src/ tests/ tools/

    - name: Check import sorting with isort
      run: |
        isort --check-only src/ tests/ tools/

    - name: Type check with mypy (informational)
      # mypy is informational because the codebase predates strict numpy/scikit
      # typing and has ~300 generic-arg / untyped-call findings that aren't
      # bugs. Keep the run for trend visibility, don't block CI on it.
      continue-on-error: true
      run: |
        mypy src/

    - name: Test with pytest
      run: |
        pytest tests/ --cov=src/png2svg_gs --cov-report=xml

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        flags: unittests
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit[toml]

    - name: Run safety scan (informational)
      # `safety check` was deprecated 2024-06; the replacement is `safety scan`.
      # Treated as informational so transient transitive-dep CVEs (which are
      # often unpatched at upstream-latest and outside our control) don't gate
      # CI on the main project package. Track findings via the run logs.
      continue-on-error: true
      run: |
        safety scan --short-report || true

    - name: Run bandit security check (informational)
      # Bandit flags potential issues in our own code; keep informational so
      # CI surfaces them without blocking unrelated work.
      continue-on-error: true
      run: |
        bandit -r src/

  build:
    runs-on: ubuntu-latest
    needs: [test, security]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        # Must satisfy requires-python (>=3.13) or the wheel-install smoke fails.
        python-version: "3.13"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        python -m build
        python -m twine check dist/*

    - name: Test package installation
      run: |
        pip install dist/*.whl
        splatlify --version
        splatlify --help

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "splatthis"
version = "0.3.0"
description = "Fit 2D Gaussian splats and export SVG, PPTX, Canvas, CSS, or EML"
readme = { file = "README_PYPI.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Bram Alkema" }]
keywords = ["svg", "pptx", "canvas", "css", "email", "mlx", "steganography", "gaussian-splatting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "numpy>=1.24",
    "Pillow>=9",
    "torch>=2",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "ruff>=0.12",
    "twine>=5",
]
capture = ["playwright>=1.55"]
steg = ["stego-lsb>=1.4"]
mlx = ["mlx>=0.15; platform_machine == 'arm64' and sys_platform == 'darwin'"]

[project.scripts]
splatthis = "splatthis.cli:main"

[project.urls]
Homepage = "https://github.com/BramAlkema/SplatThis"
Repository = "https://github.com/BramAlkema/SplatThis"
Issues = "https://github.com/BramAlkema/SplatThis/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"splatthis.templates" = ["drawingml/*.xml", "pptx/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

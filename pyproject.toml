[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splatthis"
version = "0.2.6"
description = "Fit 2D Gaussian splats to an image and deploy them as SVG, CSS, Canvas, a pixel runtime, or editable PowerPoint shapes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Bram Alkema"}
]
keywords = ["svg", "pptx", "canvas", "css", "parallax", "image", "splat", "gaussian"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.13"
dependencies = [
    "Pillow>=9.0.0",
    "numpy>=1.21.0",
    "scikit-image>=0.19.0",
    # Direct imports in splatthis (features.py and mixed_primitives.py); do not
    # rely on it arriving transitively via scikit-image.
    "scipy>=1.10",
    "psutil>=5.9.0",
    "torch>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    # Formatters PINNED so CI and local devs agree on the rules.
    # This pin is kept in lockstep with CI and requirements-dev.txt; bump both
    # together when moving to a newer black.
    "black==25.11.0",
    "isort==5.13.2",
    "mypy==1.18.2",
    "flake8==7.3.0",
    "build>=1.2.0",
    "twine>=5.0.0",
    # Renders paper/report.md to the GitHub Pages paper (tools/update_paper.py);
    # tests/unit/test_paper_page.py needs it in CI.
    "markdown>=3.6"
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]
# Governing native Canvas, CSS, pixel-runtime, and SVG capture. The tools launch
# an installed Chrome executable, so this installs the Python automation client
# without requiring a bundled browser download. Library SVG rasterizers are not
# implicit fallbacks because they are not the deployed browser target.
capture = [
    "playwright>=1.55"
]
# Apple-Silicon-native optimizer backend (the CLI default when available;
# PNG2SVGConverter falls back to torch with a warning when mlx is missing).
mlx = [
    "mlx>=0.15; platform_machine == 'arm64' and sys_platform == 'darwin'"
]

[project.scripts]
splatthis = "splatthis.cli:main"

[project.urls]
Homepage = "https://github.com/BramAlkema/SplatThis"
Repository = "https://github.com/BramAlkema/SplatThis"
Issues = "https://github.com/BramAlkema/SplatThis/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
splatthis = [
    # PEP 561 marker: without it, type checkers ignore this package's
    # annotations entirely and every consumer sees Any.
    "py.typed",
    # Published fidelity expectations, read by consumers at runtime.
    "data/*.json",
    "templates/**/*.html",
    "templates/**/*.js",
    "templates/**/*.svg",
    "templates/**/*.xml",
]

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "skimage.*",
    "cv2.*"
]
ignore_missing_imports = true

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose"
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "performance: Performance tests",
    "slow: Slow-running tests"
]
